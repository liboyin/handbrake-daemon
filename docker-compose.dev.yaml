services:
  app:
    build:
      context: .
      args:
        APT_PROXY: ${APT_PROXY:-}
        PYPI_PROXY: ${PYPI_PROXY:-}
    container_name: handbrake-daemon-app
    init: true
    runtime: nvidia
    restart: unless-stopped
    volumes:
      - /media/libo-smallfiles/Transcode:/workspaces/handbrake-daemon/assets
