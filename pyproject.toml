[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handbrake-daemon"
version = "0.0.1"
description = "Monitors for video files and runs transcode with HandBrake"
requires-python = ">=3.10"
authors = [
  {name = "Libo Yin", email = "liboyin830@gmail.com"}
]
dependencies = [
  "pathlib-extensions@git+https://github.com/liboyin/pathlib-extensions.git",
  "pymediainfo",
]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--cov=handbrake_daemon --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["."]

[tool.setuptools.packages]
find = {}
